name: yams_hub_updater
description: >-
  YAMS Hub updater sidecar: runs `docker compose pull` + `up -d --no-deps` for one
  allow-listed service of the YAMS stack (ARCHITECTURE §5.17).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  logging: ^1.3.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
dev_dependencies:
  lints: ^6.0.0
  test: ^1.29.0
